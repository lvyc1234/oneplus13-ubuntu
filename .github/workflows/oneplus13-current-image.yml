name: OnePlus 13 current image from source
on:
  workflow_dispatch:
    inputs:
      desktop_profile:
        description: Full desktop or lightweight diagnostic desktop with MSM Resources
        type: choice
        options: [full, diagnostic]
        default: diagnostic
      use_server:
        description: Use the owner's trusted ARM64 server for kernel, Mesa and SSC
        type: boolean
        default: false
      runtime_qemu:
        description: Optional runtime QEMU diagnostics
        type: boolean
        default: false
      all_on_server:
        description: Run every image job on the trusted ARM64 server, including rootfs and assembly
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    uses: ./.github/workflows/oneplus13-source-image.yml
    with:
      desktop_profile: ${{ inputs.desktop_profile }}
      use_server: ${{ inputs.use_server }}
      all_on_server: ${{ inputs.all_on_server }}
      runtime_qemu: ${{ inputs.runtime_qemu }}
